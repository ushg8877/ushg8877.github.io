<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=20261014-editorial-1">
  <script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="site-shell">
    <header class="site-rail">
      <a class="identity" href="{{ '/' | relative_url }}" aria-label="ushg8877 首页"><span class="identity-mark" aria-hidden="true">u<span>。</span></span><span class="identity-name">ushg8877</span></a>
      <div class="interests" aria-label="兴趣">算法竞赛<span> / </span>游戏开发<span> / </span>Galgame</div>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}><span>首页</span><span class="nav-mark" aria-hidden="true">↗</span></a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.url == '/archive/' %}aria-current="page"{% endif %}><span>归档</span><span class="nav-mark" aria-hidden="true">↗</span></a>
        <a href="https://github.com/ushg8877" target="_blank" rel="noopener noreferrer"><span>GitHub</span><span class="nav-mark" aria-hidden="true">↗</span></a>
      </nav>
      <button id="theme" class="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><span>深色模式</span></button>
    </header>
    <div class="site-content">
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} ushg8877</span><a href="#main" aria-label="回到顶部">↑</a></footer>
    </div>
  </div>
  <script src="{{ '/assets/site.js' | relative_url }}?v=20261014-editorial-1" defer></script>
</body>
</html>

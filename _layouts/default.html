<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v=20261015-perched-1" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=20261015-perched-1">
  <link rel="stylesheet" href="{{ '/assets/bird-flight.css' | relative_url }}?v=20261015-perched-1">
  <script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="site-shell">
    <header class="site-rail">
      <div class="identity"><button class="bird-trigger" id="bird-trigger" type="button" aria-label="让枝头的小鸟飞一会儿"><svg class="identity-mark" viewBox="0 0 72 66" aria-hidden="true"><g class="bird-perch"><path class="bird-branch" d="M7 56c17-5 35-1 57-7M19 53l-5-5m40 3 7-7"/><path class="bird-leaf" d="M14 49c-5 0-8-4-7-8 5 0 9 3 7 8Zm45-3c-1-6 3-10 9-10 0 6-4 10-9 10Z"/></g><g class="bird-figure"><path class="bird-body" d="m24 36-12-3c5 8 12 13 22 14 11 1 20-6 21-16l9-4-9-4C54 15 49 10 41 10c-9 0-16 6-16 15 0 5 1 7-1 11Z"/><path class="bird-wing" d="M28 28c5 2 10 3 16 1-1 9-9 15-17 8 3-2 4-5 1-9Z"/><circle class="bird-eye" cx="46" cy="20.5" r="1.65"/><path class="bird-leg" d="m33 46-1 7m-3 1 3-1 3 1m7-8-1 6m-3 1 3-1 3 1"/></g></svg></button><a class="identity-wordmark" href="{{ '/' | relative_url }}" aria-label="Kamome's Blog 首页"><span class="identity-name">Kamome's Blog</span></a></div>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}><span>首页</span><span class="nav-mark" aria-hidden="true">↗</span></a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.url == '/archive/' %}aria-current="page"{% endif %}><span>归档</span><span class="nav-mark" aria-hidden="true">↗</span></a>
        <a href="https://github.com/ushg8877" target="_blank" rel="noopener noreferrer"><span>GitHub</span><span class="nav-mark" aria-hidden="true">↗</span></a>
      </nav>
      <button id="theme" class="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><span>深色模式</span></button>
    </header>
    <div class="site-content">
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} Kamome's Blog</span><a href="#main" aria-label="回到顶部">↑</a></footer>
    </div>
  </div>
  <script src="{{ '/assets/site.js' | relative_url }}?v=20261015-lyrics-1" defer></script>
  <script src="{{ '/assets/bird-flight.js' | relative_url }}?v=20261015-perched-1" defer></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="giscus:backlink" content="{{ page.url | absolute_url }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v=20261015-branches-1" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=20261019-math-1">
  <link rel="stylesheet" href="{{ '/assets/article-engagement.css' | relative_url }}?v=20261018-1">
  <link rel="stylesheet" href="{{ '/assets/sealed-content.css' | relative_url }}?v=20261027-progress-1">
  <link rel="stylesheet" href="{{ '/assets/bird-flight.css' | relative_url }}?v=20261015-branches-1">
  <script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="site-shell">
    <header class="site-rail">
      <div class="identity"><button class="bird-trigger" id="bird-trigger" type="button" data-perch="left" aria-label="让小鸟飞到右边的枝头"><svg class="identity-mark" viewBox="0 0 196 128" aria-hidden="true"><g class="bird-perches" aria-hidden="true">
  <g class="bird-perch bird-perch-left">
    <path class="bird-bough" d="M13 121C22 102 19 77 12 54L14 55C22 78 24 103 16 121Z"/>
    <path class="bird-twig" d="M19 99C31 93 46 90 69 84M17 79 7 69M21 106 34 100M31 94 32 81"/>

    <path class="bird-leaf bird-leaf-light" d="M16 68C15 59 20 52 27 51 28 59 22 66 16 68ZM24 97C22 90 16 86 10 88 11 95 17 98 24 97ZM34 101C36 94 43 93 48 96 44 102 39 104 34 101Z"/>
  </g>
  <g class="bird-perch bird-perch-right">
    <path class="bird-bough" d="M171 121C163 102 167 74 173 53 176 42 175 33 172 23L174 22C178 34 179 43 176 55 170 77 167 102 174 121Z"/>
    <path class="bird-twig" d="M171 77C160 69 143 64 119 64M175 47 162 36M168 96 180 85M172 62 184 54M156 69 152 54"/>
    <path class="bird-leaf" d="M173 26C166 23 165 15 169 9 176 13 179 20 173 26ZM163 38C156 38 151 32 153 25 160 25 165 31 163 38ZM152 57C146 54 144 47 148 41 154 45 156 51 152 57ZM177 88C176 81 182 75 188 76 187 82 183 87 177 88Z"/>
    <path class="bird-leaf bird-leaf-light" d="M175 43C174 35 180 29 187 30 188 38 182 43 175 43ZM181 58C179 51 184 45 190 45 191 51 187 56 181 58ZM166 105C159 103 155 97 157 91 164 92 168 98 166 105ZM124 65C121 59 115 56 109 59 112 65 118 68 124 65Z"/>
  </g>
</g>
<g class="bird-traveler"><g class="bird-facing"><g class="bird-figure">
  <path class="bird-tail" d="M-12-16-25-21C-23-12-19-7-11-7Z"/>
  <path class="bird-body" d="M-15-20C-16-30-9-37 1-36 9-36 14-30 14-24L21-20 14-16C12-7 5-3-4-4-12-5-17-11-15-20Z"/>
  <path class="bird-belly" d="M-13-16C-9-11-4-11 3-14 7-15 10-17 12-20 12-10 6-5-3-5-8-5-13-9-13-16Z"/>
  <path class="bird-wing" d="M-12-24C-7-25-1-22 1-17 0-11-7-10-12-15-8-16-8-20-12-24Z"/>
  <circle class="bird-eye" cx="7" cy="-26" r="1.4"/>
  <circle class="bird-cheek" cx="10" cy="-21.5" r="1.9"/>
  <path class="bird-leg" d="M-5-5-6 0m-3 1 3-1 3 1M3-4 4-1m-2 2 2-2 3 1"/>
</g></g></g></svg></button><a class="identity-wordmark" href="{{ '/' | relative_url }}" aria-label="Kamome's Blog 首页"><span class="identity-name">Kamome's Blog</span></a></div>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}><span>首页</span><span class="nav-mark" aria-hidden="true">↗</span></a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.url == '/archive/' %}aria-current="page"{% endif %}><span>归档</span><span class="nav-mark" aria-hidden="true">↗</span></a>
        <a href="https://github.com/ushg8877" target="_blank" rel="noopener noreferrer"><span>GitHub</span><span class="nav-mark" aria-hidden="true">↗</span></a>
      </nav>
      {% if page.access_id %}<button id="access-open" class="access-trigger" type="button" aria-haspopup="dialog" aria-controls="access-dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><span>验证访问码</span></button>{% endif %}
      <button id="theme" class="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><span>深色模式</span></button>
    </header>
    <div class="site-content">
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} Kamome's Blog</span><span class="site-visit-count" id="vercount_container_site_pv">总浏览 <span id="vercount_value_site_pv">—</span> 次</span><a href="#main" aria-label="回到顶部">↑</a></footer>
    </div>
  </div>
  {% if page.access_id %}{% include access-dialog.html %}{% endif %}
  <script src="{{ '/assets/site.js' | relative_url }}?v=20261019-no-lyrics-1" defer></script>
  <script src="{{ '/assets/bird-flight.js' | relative_url }}?v=20261015-branches-1" defer></script>
  <script src="{{ '/assets/article-engagement.js' | relative_url }}?v=20261018-1" defer></script>
  <script src="{{ '/assets/page-views.js' | relative_url }}?v=20261018-1" defer></script>
  <script src="{{ '/assets/sealed-content.js' | relative_url }}?v=20261027-progress-1" defer></script>
</body>
</html>

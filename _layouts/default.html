<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v=bird-1" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=20261015-lyrics-1">
  <link rel="stylesheet" href="{{ '/assets/bird-flight.css' | relative_url }}?v=20261015-bird-3">
  <script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="site-shell">
    <header class="site-rail">
      <div class="identity"><button class="bird-trigger" id="bird-trigger" type="button" aria-label="让小鸟起飞"><svg class="identity-mark" viewBox="0 0 72 66" aria-hidden="true"><g class="bird-figure"><path class="bird-body" d="M8 34c7 2 13 0 18-5-1-10 5-17 14-17 8 0 13 6 13 13l10 5-11 4c-3 12-14 19-27 14C16 45 11 40 8 34Z"/><path class="bird-wing" d="M17 34c7 1 15-2 22-9 2 13-7 20-22 9Z"/><circle class="bird-eye" cx="44.5" cy="22" r="1.7"/><path class="bird-leg" d="m34 47-2 7m-4 0h8"/></g><path class="bird-water" d="M16 59c8-2 16-2 23 0m6 0h8"/></svg></button><a class="identity-wordmark" href="{{ '/' | relative_url }}" aria-label="Kamome's Blog 首页"><span class="identity-name">Kamome's Blog</span></a></div>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}><span>首页</span><span class="nav-mark" aria-hidden="true">↗</span></a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.url == '/archive/' %}aria-current="page"{% endif %}><span>归档</span><span class="nav-mark" aria-hidden="true">↗</span></a>
        <a href="https://github.com/ushg8877" target="_blank" rel="noopener noreferrer"><span>GitHub</span><span class="nav-mark" aria-hidden="true">↗</span></a>
      </nav>
      <button id="theme" class="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><span>深色模式</span></button>
    </header>
    <div class="site-content">
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} Kamome's Blog</span><a href="#main" aria-label="回到顶部">↑</a></footer>
    </div>
  </div>
  <script src="{{ '/assets/site.js' | relative_url }}?v=20261015-lyrics-1" defer></script>
  <script src="{{ '/assets/bird-flight.js' | relative_url }}?v=20261015-bird-3" defer></script>
</body>
</html>

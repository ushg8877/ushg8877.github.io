<dialog id="access-dialog" class="access-dialog" aria-label="验证访问码" data-manifest="{{ '/assets/access/keys.json' | relative_url }}">
  <form id="access-form" novalidate>
    <input id="access-code" name="access-code" type="password" aria-label="访问码" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" maxlength="80" required aria-describedby="access-status">
  </form>
  <span id="access-status" class="access-visually-hidden" role="status" aria-live="polite"></span>
</dialog>
